name: "Version Run Number"
description: "Generates a version number from github.ref.runNumber"
author: "Nivaes"
outputs:
  version:
    description: "The generate version on run number"
runs:
  using: "composite"
  steps:
    - name: Instalar dotnet-script
      shell: bash
      run: dotnet tool install -g dotnet-script

    - name: Ejecutar script C#
      id: run
      shell: bash
      run: |
        result=$(~/.dotnet/tools/dotnet-script src/run.csx)
        echo "Version: $result"
        echo "version=$result" >> $GITHUB_OUTPUT
branding:
  icon: "tag"
  color: "gray-dark"
