name: "Version Run Number"
description: "Generates a version number from github.ref.runNumber"
author: "Nivaes"
outputs:
  version:
    description: "The generate version on run number"
runs:
  using: "composite"
  steps:
    - name: Instalar dotnet-script
      shell: bash
      run: dotnet tool install -g dotnet-script

    - name: Ejecutar script C#
      id: run
      shell: bash
      # run: |
      #   result=$(~/.dotnet/tools/dotnet-script src/generate-version.csx)
      #   echo "output=$result" >> $GITHUB_OUTPUT
      run: |
        result=$(~/.dotnet/tools/csi src/generate-version.csx)
        echo "output=$result" >> $GITHUB_OUTPUT
branding:
  icon: "tag"
  color: "gray-dark"
