name: "Version Pack"
description: "Generates a version number from github.ref.version-pack"
author: "Nivaes"
outputs:
  version:
    description: "The generate version pack"
    value: ${{ steps.run.outputs.version }}
runs:
  using: "composite"
  steps:
    - name: Instalar dotnet-script
      shell: bash
      run: dotnet tool install -g dotnet-script

    - name: Ejecutar script C#
      id: run
      shell: bash
      run: |
        result=$(~/.dotnet/tools/dotnet-script src/run.csx)
        echo Version: $result
        echo "version=$result" >> $GITHUB_OUTPUT
branding:
  icon: "tag"
  color: "gray-dark"
